apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: weightbuffers.wpi.sig.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, prototype"
spec:
  group: wpi.sig.k8s.io
  names:
    kind: WeightBuffer
    plural: weightbuffers
    singular: weightbuffer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                provider:
                  type: string
                capacity:
                  type: string
                sourcePath:
                  type: string
                layout:
                  type: string
                retentionPolicy:
                  type: string
                sharding:
                  type: object
                  properties:
                    strategy:
                      type: string
                      enum:
                        - TensorParallel
                        - ExpertParallel
                        - PipelineParallel
                        - Custom
                    numShards:
                      type: integer
                      minimum: 1
                    shardFiles:
                      type: array
                      items:
                        type: object
                        properties:
                          index:
                            type: integer
                          path:
                            type: string
                          sizeBytes:
                            type: integer
                            format: int64
                        required:
                          - index
                          - path
                    filePattern:
                      type: string
                  required:
                    - strategy
                    - numShards
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                totalShards:
                  type: integer
                discoveredShards:
                  type: array
                  items:
                    type: object
                    properties:
                      index:
                        type: integer
                      path:
                        type: string
                      sizeBytes:
                        type: integer
                        format: int64

