apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: weightbuffers.wpi.sig.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, prototype"
spec:
  group: wpi.sig.k8s.io
  names:
    kind: WeightBuffer
    plural: weightbuffers
    singular: weightbuffer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                provider:
                  type: string
                size:
                  type: string
                sourcePath:
                  type: string
                layout:
                  type: string
                retentionPolicy:
                  type: string
