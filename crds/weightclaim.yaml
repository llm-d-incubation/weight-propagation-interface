apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: weightclaims.wpi.sig.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, prototype"
spec:
  group: wpi.sig.k8s.io
  names:
    kind: WeightClaim
    plural: weightclaims
    singular: weightclaim
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sourceBuffer:
                  type: string
                propagationPolicy:
                  type: string
                targetLayout:
                  type: string
                shardIndex:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                assignedShardIndex:
                  type: integer

