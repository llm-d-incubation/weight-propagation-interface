apiVersion: wpi.sig.k8s.io/v1alpha1
kind: WeightBuffer
metadata:
  name: demo-weight-buffer
  namespace: wpi-system
spec:
  capacity: "75Gi"
  sourcePath: "/tmp/dummy.safetensors"
---
apiVersion: wpi.sig.k8s.io/v1alpha1
kind: WeightClaim
metadata:
  name: demo-weight-claim
  namespace: wpi-system
spec:
  weightBufferName: "demo-weight-buffer"
