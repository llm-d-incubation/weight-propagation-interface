apiVersion: v1
kind: ServiceAccount
metadata:
  name: wpi-driver
  namespace: wpi-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wpi-driver-role
rules:
- apiGroups: ["wpi.sig.k8s.io"]
  resources: ["weightclaims", "weightbuffers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wpi-driver-rolebinding
subjects:
- kind: ServiceAccount
  name: wpi-driver
  namespace: wpi-system
roleRef:
  kind: ClusterRole
  name: wpi-driver-role
  apiGroup: rbac.authorization.k8s.io
