                  DiscoveredShards contains the resolved metadata for each shard
                  after the operator has performed shard discovery.
                items:
                  description: DiscoveredShard represents a resolved shard after discovery.
                  properties:
                    index:
                      description: Index is the shard number (0-indexed).
                      type: integer
                    path:
                      description: Path is the resolved path to the shard file.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the resolved size of this shard.
                      format: int64
                      type: integer
                  required:
                  - index
                  - path
                  - sizeBytes
                  type: object
                type: array
              totalShards:
                description: |-
                  TotalShards is the resolved total number of shards.
                  0 or absent means the buffer is not sharded.
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
