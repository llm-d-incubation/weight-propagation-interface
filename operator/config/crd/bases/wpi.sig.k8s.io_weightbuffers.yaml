metadata:
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes/kubernetes/pull/123
    controller-gen.kubebuilder.io/version: v0.20.1
  name: weightbuffers.wpi.sig.k8s.io
spec:
  group: wpi.sig.k8s.io
  names:
    kind: WeightBuffer
    listKind: WeightBufferList
    plural: weightbuffers
    singular: weightbuffer
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WeightBuffer is the Schema for the weightbuffers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WeightBuffer
            properties:
              capacity:
                description: Capacity is the total size of the weight buffer (e.g.,
                  "10Gi").
                type: string
              sharding:
                description: |-
                  Sharding defines how this buffer is partitioned across GPUs.
                  If nil, the buffer is treated as a single monolithic block.
                properties:
                  filePattern:
                    description: |-
                      FilePattern is a glob pattern for auto-discovering shard files
                      within SourcePath (e.g., "model-*-of-*.safetensors").
                      Mutually exclusive with ShardFiles.
                    type: string
                  numShards:
                    description: NumShards is the total number of shards the model
                      is split into.
                    type: integer
                  shardFiles:
                    description: |-
                      ShardFiles is an explicit mapping of shard index to file.
                      If omitted, the operator uses FilePattern for auto-discovery.
                    items:
                      description: ShardFile maps a shard index to its source file
                        on shared storage.
                      properties:
                        index:
                          description: Index is the shard number (0-indexed).
                          type: integer
                        path:
                          description: Path to the shard file on shared storage.
                          type: string
                        sizeBytes:
                          description: SizeBytes is the size of this specific shard
                            in bytes.
                          format: int64
                          type: integer
                      required:
                      - index
                      - path
                      type: object
                    type: array
                  strategy:
                    description: Strategy is the parallelism pattern used to split
                      the model.
                    enum:
                    - TensorParallel
                    - ExpertParallel
                    - PipelineParallel
                    - Custom
                    type: string
                required:
                - numShards
                - strategy
                type: object
              sourcePath:
                description: |-
                  SourcePath is the URI or local path to load the weights from.
                  For sharded models, this is the directory containing shard files.
                type: string
            type: object
          status:
            description: status defines the observed state of WeightBuffer
            properties:
              conditions:
