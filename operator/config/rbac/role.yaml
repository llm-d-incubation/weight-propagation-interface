---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - wpi.sig.k8s.io
  resources:
  - weightbuffers
  - weightclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - wpi.sig.k8s.io
  resources:
  - weightbuffers/finalizers
  - weightclaims/finalizers
  verbs:
  - update
- apiGroups:
  - wpi.sig.k8s.io
  resources:
  - weightbuffers/status
  - weightclaims/status
  verbs:
  - get
  - patch
  - update
